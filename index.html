  <title>Jonah Joins the Navy</title>
</head><body><noscript><style>@font-face{font-family:Instrument;src:url('./fonts/InstrumentSerif.woff2') format('woff2');font-display:swap}@font-face{font-family:Hebrew;src:url('./fonts/NotoSansHebrew.woff2') format('woff2');font-display:swap}@font-face{font-family:Noto;src:url('./fonts/NotoSans.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{background:#071b30;color:#f4f0e7;margin:0;font-family:Noto,Arial,sans-serif}.fallback-scene{min-height:100svh;display:grid;grid-template-columns:48% 52%;align-items:start}.fallback-scene>img{position:sticky;top:0;width:100%;height:100svh;object-fit:contain}.fallback-content{padding:56px 9%}.fallback-scene h1{font:400 clamp(30px,2.65vw,48px)/1.12 Instrument,Georgia,serif;margin:0 0 32px}.fallback-scene p{font:16px/1.7 Noto,Arial,sans-serif}.fallback-quotes{display:grid;gap:32px}.lyric-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;font-size:clamp(22px,1.75vw,34px)}.lyric-pair .lyric-english{margin:0;font:400 1em/1.15 Instrument,Georgia,serif;text-wrap:balance}.lyric-pair .lyric-hebrew{margin:0;font:400 .9em/1.65 Hebrew,Noto,Arial,sans-serif;text-align:right;text-wrap:balance;unicode-bidi:plaintext}[lang=he]{font-family:Hebrew,Noto,Arial,sans-serif}.fallback-bible{border-top:1px solid #b9996140;margin-top:40px;padding-top:24px}.fallback-bible small{display:block;margin-top:22px;line-height:1.6;color:#b99961}.fallback-sources{padding:8vw;background:#f4f0e7;color:#071b30}.fallback-sources h2{font:400 40px/1.1 Instrument,Georgia,serif}.fallback-sources p{max-width:740px;line-height:1.8}.fallback-sources a{color:inherit}@media(max-width:767px){.fallback-scene{display:block}.fallback-scene>img{position:static;height:55svh}.fallback-content{padding:32px 7%}.fallback-scene h1{font-size:34px}.lyric-pair{grid-template-columns:minmax(0,1fr);gap:14px;font-size:27px}.fallback-quotes{gap:32px}.lyric-pair .lyric-hebrew{font-size:.88em}}</style><section class="fallback-scene" id="enlist"><img src="./cinematic/poster-enlist.webp" alt="Jonah joins the navy, trains as a sailor, and boards the fictional destroyer INS Tarshish."><div class="fallback-content"><h1>Jonah Joins the Navy</h1><p lang="he" dir="rtl">הצוללן העברי הראשון</p><p>Hebrew song excerpts with English translations.</p><div class="fallback-quotes"><div class="lyric-pair" data-quote="enlisted"><p class="lyric-english" lang="en" dir="ltr">He enlisted in the navy one fine day.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">בְּיוֹם אֶחָד בָּהִיר הִתְגַּיֵּס לְחֵיל הַיָם.</blockquote></div><div class="lyric-pair" data-quote="board"><p class="lyric-english" lang="en" dir="ltr">He boarded a destroyer.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">עָלָה עַל מַשְׁחֵתָּה</blockquote></div></div><p>The song’s destroyer is named INS Tarshish.</p></div></section><section class="fallback-scene" id="storm"><img src="./cinematic/poster-storm.webp" alt="The sea begins to rage while Jonah sleeps in a corner. A great wave washes him overboard."><div class="fallback-content"><h1>Jonah sleeps; the sea rises</h1><div class="fallback-quotes"><div class="lyric-pair" data-quote="sleep"><p class="lyric-english" lang="en" dir="ltr">He lay asleep in a corner.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">בַּפִּנָּה שָׁכַב נִרְדַּם.</blockquote></div><div class="lyric-pair" data-quote="wave"><p class="lyric-english" lang="en" dir="ltr">A great wave came and washed him into the sea.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">הִגִּיעַ גַּל גָּדוֹל וְשָׁטַף אוֹתוֹ לַיָּם.</blockquote></div></div></div></section><section class="fallback-scene" id="transfer"><img src="./cinematic/poster-transfer.webp" alt="Jonah barely survives because he cannot swim. He requests a transfer and boards a torpedo boat. When it keeps rolling on the waves, he volunteers to serve in a submarine."><div class="fallback-content"><h1>A transfer, then a torpedo boat</h1><div class="fallback-quotes"><div class="lyric-pair" data-quote="survival"><p class="lyric-english" lang="en" dir="ltr">He barely survived, because he did not know how to swim.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">בְּקשִׁי הוּא נִצַּל, כִּי לִשְׂחוֹת הוּא לֹא יָדַע.</blockquote></div><div class="lyric-pair" data-quote="transfer"><p class="lyric-english" lang="en" dir="ltr">He requested a transfer and boarded a torpedo boat.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">בִּקֵּשׁ “הַעֲבָרָה” וְעָלָה לְטַרְפְּדָה.</blockquote></div><div class="lyric-pair" data-quote="rolling"><p class="lyric-english" lang="en" dir="ltr">The rolling on the water went on and on.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">רַבִּים הַטִּלְטוּלִים עַל הַמַּיִם כָּל הַזְּמַן.</blockquote></div><div class="lyric-pair" data-quote="volunteer"><p class="lyric-english" lang="en" dir="ltr">In that case, I’ll volunteer as a submariner.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">אִם כָּךְ, אֶתְנַדֵּב כְּצוֹלְלָן.</blockquote></div></div></div></section><section class="fallback-scene" id="england"><img src="./cinematic/poster-england.webp" alt="With no submarines available, they travel to England for training and buy a giant fish. Jonah enters its innards."><div class="fallback-content"><h1>England delivers a giant fish</h1><div class="fallback-quotes"><div class="lyric-pair" data-quote="buy"><p class="lyric-english" lang="en" dir="ltr">They went to England and bought a giant fish there.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">לְאַנְגְלִיָה נָסְעוּ וְקָנוּ שָׁם דָּג עֲנָק</blockquote></div><div class="lyric-pair" data-quote="enter"><p class="lyric-english" lang="en" dir="ltr">And so Jonah entered the fish’s innards.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">וְכָךְ נִכְנַס יוֹנָה לַמֵּעַיִם שֶׁל הַדָּג.</blockquote></div></div></div></section><section class="fallback-scene" id="machine"><img src="./cinematic/poster-machine.webp" alt="It is cramped inside, like any submarine. Jonah hangs a hammock between the spleen and kidneys, oils the liver, and cleans the gallbladder. He pulls the large intestine and fires a torpedo. The living submarine sets off."><div class="fallback-content"><h1>The fish’s body becomes machinery</h1><div class="fallback-quotes"><div class="lyric-pair" data-quote="cramped"><p class="lyric-english" lang="en" dir="ltr">It was cramped inside, as in every submarine.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">בִּפְנִים הָיָה צָפוּף, כְּמוֹ בְּכָל הַצּוֹלְלוֹת.</blockquote></div><div class="lyric-pair" data-quote="hammock"><p class="lyric-english" lang="en" dir="ltr">Jonah stretched a hammock between the spleen and kidneys.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">יוֹנָה מָתַח עַרְסָל בֵּין הַטְּחוֹל וְהַכְּלָיוֹת</blockquote></div><div class="lyric-pair" data-quote="liver"><p class="lyric-english" lang="en" dir="ltr">He oiled the liver.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">שִׁמֵּן אֶת הַכָּבֵד</blockquote></div><div class="lyric-pair" data-quote="gallbladder"><p class="lyric-english" lang="en" dir="ltr">And he cleaned the gallbladder.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">וְנִקָּה אֶת הַמָּרָה</blockquote></div><div class="lyric-pair" data-quote="launch"><p class="lyric-english" lang="en" dir="ltr">He pulled the large intestine—and swiftly fired a torpedo.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">מָשַׁךְ בַּמְּעִי הַגַּס – וְטוֹרְפֵּדוֹ חִישׁ יָרָה.</blockquote></div><div class="lyric-pair" data-quote="living"><p class="lyric-english" lang="en" dir="ltr">Then the living submarine set off.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">לַדֶּרֶךְ אָז יָצְאָה הַצּוֹלֶלֶת הַחַיָּה.</blockquote></div></div></div></section><section class="fallback-scene" id="periscope"><img src="./cinematic/poster-periscope.webp" alt="Jonah peers through the fish’s throat, now a periscope, and steers confidently toward Nineveh. After years inside the fish, he receives a commendation as the number-one submariner."><div class="fallback-content"><h1>Nineveh comes into view</h1><div class="fallback-quotes"><div class="lyric-pair" data-quote="throat"><p class="lyric-english" lang="en" dir="ltr">He peered through the periscope—the tube of the throat.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">הֵצִיץ בַּפֵּרִיסְקוֹפּ, בַּצִּנוֹר שֶׁל הַגָּרוֹן</blockquote></div><div class="lyric-pair" data-quote="harbor"><p class="lyric-english" lang="en" dir="ltr">And he steered confidently toward the port of Nineveh.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">וְלִנְמַל נִינְוֶה הוּא נִוֵּט בְּבִטָּחוֹן.</blockquote></div><div class="lyric-pair" data-quote="service"><p class="lyric-english" lang="en" dir="ltr">He even received a commendation: “Number-one submariner.”</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">וְגַם קִבֵּל צָלָ&quot;ש: “צוֹלְלָן מִסְפָּר אַחַת.”</blockquote></div></div><p>The song imagines Nineveh as a port.</p></div></section><section class="fallback-scene" id="lab"><img src="./cinematic/poster-lab.webp" alt="After leaving the navy, Jonah goes to the Technion, Israel’s institute of technology. There he researches kikayon plants—the plant from Jonah 4. This is where the song ends."><div class="fallback-content"><h1>The prophet becomes a researcher</h1><div class="fallback-quotes"><div class="lyric-pair" data-quote="technion"><p class="lyric-english" lang="en" dir="ltr">When he was discharged, he went on to the Technion.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">וּכְשֶׁהוּא הִשְׁתַּחְרֵר – הוּא עָבַר לַטֶּכְנִיּוֹן</blockquote></div><div class="lyric-pair" data-quote="research"><p class="lyric-english" lang="en" dir="ltr">There he researches kikayon plants.</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://benyehuda.org/read/12456">שָׁם הוּא עוֹשֶׂה מֶחְקָר עַל צִמְחֵי הַקִּיקָיוֹן.</blockquote></div></div><p>The Technion is Israel’s institute of technology. Kikayon is the plant from Jonah 4.</p><div class="fallback-bible"><p>Back to the biblical book</p><div class="lyric-pair"><p class="lyric-english" lang="en" dir="ltr">And should I not care about Nineveh?</p><blockquote class="lyric-hebrew" lang="he" dir="rtl" cite="https://mechon-mamre.org/p/pt/pt1704.htm">וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה</blockquote></div><small>God’s question to Jonah · Jonah 4:11, excerpt · working English translation</small></div></div></section><section class="fallback-sources" id="references"><h2>The song and its sources</h2><p>Words: Dan Almagor. Music: Albert Piamenta. Performed by Arik Lavie. Original generated artwork. The destroyer and harbor are fictional; the plant is a stylized kikayon.</p><p><a href="https://benyehuda.org/read/12456">Lyrics and credits</a></p><p><a href="https://www.youtube.com/watch?v=E4hRF0R1T-s">Listen to the recording</a></p><p><a href="https://mechon-mamre.org/p/pt/pt1704.htm">Jonah 4 in Hebrew</a></p><p>Brief Hebrew song excerpts are paired with working English translations. The final question is from the biblical book of Jonah, after the song’s ending.</p></section></noscript><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
