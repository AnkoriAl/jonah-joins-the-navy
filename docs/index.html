</head><body><noscript><style>body{background:#071b30;color:#f4f0e7;margin:0;font-family:Georgia,serif} .fallback-scene{min-height:100vh;padding:0 0 6vw} .fallback-scene img{width:100%;height:70vh;object-fit:contain} .fallback-scene h1,.fallback-scene p{margin:4vw 8vw} .fallback-scene h1{font-size:clamp(28px,4vw,60px)} .fallback-scene p{font:18px/1.7 Arial,sans-serif} .fallback-sources{padding:8vw;background:#f4f0e7;color:#071b30}</style><section class="fallback-scene" id="enlist"><img src="./cinematic/poster-enlist.webp" alt="Jonah joins the navy, trains as a sailor, and boards the fictional destroyer INS Tarshish."><h1>Jonah Joins the Navy</h1><p lang="he" dir="rtl">הצוללן העברי הראשון</p><p>A short English retelling of the song</p><p>Jonah joins the navy, trains as a sailor, and boards the fictional destroyer INS Tarshish.</p></section><section class="fallback-scene" id="storm"><img src="./cinematic/poster-storm.webp" alt="The sea begins to rage while Jonah sleeps in a corner. A great wave washes him overboard."><h1>A great wave washes the sleeping Jonah into the sea.</h1><p>The sea begins to rage while Jonah sleeps in a corner. A great wave washes him overboard.</p></section><section class="fallback-scene" id="transfer"><img src="./cinematic/poster-transfer.webp" alt="Jonah barely survives because he cannot swim. He requests a transfer and boards a torpedo boat. When it keeps rolling on the waves, he volunteers to serve in a submarine."><h1>He transfers to a torpedo boat, then volunteers for submarine service.</h1><p>Jonah barely survives because he cannot swim. He requests a transfer and boards a torpedo boat. When it keeps rolling on the waves, he volunteers to serve in a submarine.</p></section><section class="fallback-scene" id="england"><img src="./cinematic/poster-england.webp" alt="With no submarines available, they travel to England for training and buy a giant fish. Jonah enters its innards."><h1>In England for training, the navy buys a giant fish.</h1><p>With no submarines available, they travel to England for training and buy a giant fish. Jonah enters its innards.</p></section><section class="fallback-scene" id="machine"><img src="./cinematic/poster-machine.webp" alt="It is cramped inside, like any submarine. Jonah hangs a hammock between the spleen and kidneys, oils the liver, and cleans the gallbladder. He pulls the large intestine and fires a torpedo. The living submarine sets off."><h1>Jonah turns the fish’s organs into submarine machinery.</h1><p>It is cramped inside, like any submarine. Jonah hangs a hammock between the spleen and kidneys, oils the liver, and cleans the gallbladder. He pulls the large intestine and fires a torpedo. The living submarine sets off.</p></section><section class="fallback-scene" id="periscope"><img src="./cinematic/poster-periscope.webp" alt="Jonah peers through the fish’s throat, now a periscope, and steers confidently toward Nineveh. After years inside the fish, he receives a commendation as the number-one submariner."><h1>He steers toward Nineveh and earns a commendation.</h1><p>Jonah peers through the fish’s throat, now a periscope, and steers confidently toward Nineveh. After years inside the fish, he receives a commendation as the number-one submariner.</p><p>The song imagines Nineveh as a port.</p></section><section class="fallback-scene" id="lab"><img src="./cinematic/poster-lab.webp" alt="After leaving the navy, Jonah goes to the Technion, Israel’s institute of technology. There he researches kikayon plants—the plant from Jonah 4. This is where the song ends."><h1>After the navy, he researches kikayon plants at the Technion.</h1><p>After leaving the navy, Jonah goes to the Technion, Israel’s institute of technology. There he researches kikayon plants—the plant from Jonah 4. This is where the song ends.</p><div class="fallback-bible"><p>Back to the biblical book</p><h2 style="margin:4vw 8vw">And should I not care about Nineveh?</h2><p lang="he" dir="rtl">וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה</p><p>God’s question to Jonah · Jonah 4:11, excerpt. Working English translation.</p></div></section><section class="fallback-sources" id="references"><h2>The song and its sources</h2><p>Words: Dan Almagor. Music: Albert Piamenta. Performed by Arik Lavie. Original generated artwork. The destroyer and harbor are fictional; the plant is a stylized kikayon.</p><p><a href="https://benyehuda.org/read/12456">Lyrics and credits</a></p><p><a href="https://www.youtube.com/watch?v=E4hRF0R1T-s">Listen to the recording</a></p><p><a href="https://mechon-mamre.org/p/pt/pt1704.htm">Jonah 4 in Hebrew</a></p></section></noscript><div id="root"></div></body></html>
