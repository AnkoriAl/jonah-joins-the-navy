</head><body><noscript><style>body{background:#071b30;color:#f4f0e7;margin:0;font-family:Georgia,serif} .fallback-scene{min-height:100vh;padding:0 0 6vw} .fallback-scene img{width:100%;height:70vh;object-fit:contain} .fallback-scene h1,.fallback-scene p{margin:4vw 8vw} .fallback-scene h1{font-size:clamp(28px,4vw,60px)} .fallback-scene p{font:18px/1.7 Arial,sans-serif} .fallback-sources{padding:8vw;background:#f4f0e7;color:#071b30}</style><section class="fallback-scene" id="enlist"><img src="./cinematic/poster-enlist.webp" alt="Jonah becomes a sailor aboard the fictional destroyer INS Tarshish."><h1>Jonah Joins the Navy</h1><p lang="he" dir="rtl">הצוללן העברי הראשון</p><p>Jonah becomes a sailor aboard the fictional destroyer INS Tarshish.</p></section><section class="fallback-scene" id="storm"><img src="./cinematic/poster-storm.webp" alt="A wave carries the sleeping Jonah overboard."><h1>Jonah sleeps. The sea rises.</h1><p>A wave carries the sleeping Jonah overboard.</p></section><section class="fallback-scene" id="transfer"><img src="./cinematic/poster-transfer.webp" alt="He requests a transfer and volunteers for submarine service."><h1>An unusual transfer</h1><p>He requests a transfer and volunteers for submarine service.</p></section><section class="fallback-scene" id="england"><img src="./cinematic/poster-england.webp" alt="A living silver fish becomes Jonah’s submarine."><h1>In England, they bought a giant fish.</h1><p>A living silver fish becomes Jonah’s submarine.</p></section><section class="fallback-scene" id="machine"><img src="./cinematic/poster-machine.webp" alt="Hammock between spleen and kidneys; liver oil, gallbladder cleaning, intestinal torpedo control."><h1>A living submarine</h1><p>Hammock between spleen and kidneys; liver oil, gallbladder cleaning, intestinal torpedo control.</p></section><section class="fallback-scene" id="periscope"><img src="./cinematic/poster-periscope.webp" alt="The throat becomes a periscope. Years of service bring a commendation."><h1>Nineveh, imagined as a port.</h1><p>The throat becomes a periscope. Years of service bring a commendation.</p></section><section class="fallback-scene" id="lab"><img src="./cinematic/poster-lab.webp" alt="Technion research gives the song a career ending. Jonah 4:11 leaves a question."><h1>And should I not care about Nineveh?</h1><p lang="he" dir="rtl">וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה</p><p>Jonah 4:11, excerpt; working English translation.</p><p>Technion research gives the song a career ending. Jonah 4:11 leaves a question.</p></section><section class="fallback-sources" id="references"><h2>The song and its sources</h2><p>Words: Dan Almagor. Music: Albert Piamenta. Performed by Arik Lavie. Original generated artwork. The destroyer and harbor are fictional; the plant is a stylized kikayon.</p><p><a href="https://benyehuda.org/read/12456">Lyrics and credits</a></p><p><a href="https://www.youtube.com/watch?v=E4hRF0R1T-s">Listen to the recording</a></p><p><a href="https://mechon-mamre.org/p/pt/pt1704.htm">Jonah 4 in Hebrew</a></p></section></noscript><div id="root"></div></body></html>
